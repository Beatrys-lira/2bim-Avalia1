<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <header><h1>Desenho Assinado</h1><p>Escolha um número de 1 a 100 para gerar um desenho assinado com o e-mail da sua conta Google.</p></header>
    <section class="conta" aria-label="Conta Google">
      <div id="login"><h2>Entre para começar</h2><p>Faça login com Google para liberar a geração do desenho.</p>
        <div id="g_id_onload" data-client_id="59170075064-jfndmcohrnb8f74likejjdmv3ebqa5t7.apps.googleusercontent.com" data-callback="receberLogin" data-auto_prompt="false"></div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="pill"></div>
      </div>
      <div id="estudio" hidden><div class="perfil"><div class="avatar"><span id="iniciais" aria-hidden="true"></span><img id="foto" alt="Foto do perfil Google" referrerpolicy="no-referrer" hidden></div><div class="dados"><h2 id="saudacao"></h2><p>Que bom ter você aqui!</p><strong id="nome"></strong><span id="email"></span></div><button id="sair" type="button" class="secundario">Sair</button></div></div>
    </section>
    <form id="formulario" novalidate><label for="numero">Número</label><div class="campos"><input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="Ex.: 6" disabled><button id="gerar" type="submit" disabled>Gerar desenho</button></div></form>
    <p id="mensagem" role="alert"></p>
    <section class="resultado" aria-label="Desenho gerado"><div id="vazio"><p>Seu desenho aparecerá aqui.</p></div><figure id="desenho" aria-live="polite"></figure><button id="baixar" type="button" hidden>Baixar SVG</button></section>
  </main>
</body>
</html>
